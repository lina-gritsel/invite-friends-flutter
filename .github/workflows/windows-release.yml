name: Windows release

on:
  push:
    branches: [codex/windows-exe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Add Windows runner
        run: flutter create --platforms=windows --project-name invite_friends .

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows application
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/invite-friends-windows-x64.zip

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: invite-friends-windows-x64
          path: build/invite-friends-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
